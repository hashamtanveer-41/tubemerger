[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubemerger"
version = "1.1.2"
description = "Merge YouTube playlists into a single video or separate files"

readme = "README.md"
authors = [
    { name = "TubeMerger Team", email = "support@tubemerger.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "yt-dlp>=2024.08.06",
    "pydantic>=2.0.0",
    "pywebview>=5.0",
    "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://tubemerger.com"

[project.scripts]
tubemerge = "tubemerge.app:run"

[tool.setuptools.packages.find]
where = ["src"]
